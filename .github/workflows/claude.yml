name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  interactive:
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'OWNER'))  ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       (github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: megaeth-labs/documentation/.github/actions/claude-interactive@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "mega-putin"

  pr-review:
    concurrency:
      group: claude-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: |
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'opened' ||
       github.event.action == 'synchronize' ||
       github.event.action == 'ready_for_review' ||
       github.event.action == 'reopened') &&
      (github.event.pull_request.user.type != 'Bot' ||
       github.event.pull_request.user.login == 'mega-putin[bot]')
    runs-on: ubuntu-24.04
    # 35 rather than 25: the pre-mortem track (on by default) adds two rounds of
    # sub-agent work on top of the standard review.
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # Review under the CI app identity rather than the job token: it is what
      # lets the action resolve stale review threads (the shared action gates
      # --resolve-threads on github_identity_token being non-empty).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.MEGA_CI_APP_PK }}
          owner: megaeth-labs
          repositories: documentation

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1
          # Keep pull_request_target on trusted base-branch code.
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Detect claude workflow changes
        id: workflow-change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            --paginate \
            --jq '.[] | select(.filename == ".github/workflows/claude.yml") | .filename' \
            | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping pr-review because this PR modifies .github/workflows/claude.yml."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: megaeth-labs/documentation/.github/actions/claude-pr-review@main
        if: steps.workflow-change.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_identity_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "mega-putin"
